<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph 状态图执行模型</title>
  <desc id="desc">LangGraph 用 StateGraph、节点、边、Reducer、Checkpoint 和人工审核构建可控 Agent 流程。</desc>
  <defs><style>.h{font:700 28px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#1f1d38}.p{font:400 15px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#646178}.box{fill:#fff;stroke:#dad8ee;stroke-width:2}.t{font:700 17px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#312e81}.s{font:400 13px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#615e74}</style></defs>
  <rect width="980" height="420" rx="28" fill="#f8f7ff"/>
  <text x="58" y="66" class="h">LangGraph：用状态图管理复杂 Agent</text>
  <text x="58" y="96" class="p">适合多轮、可暂停、可恢复、有人审、带循环的复杂流程，而不是一次性的简单 Chain。</text>
  <g transform="translate(78 145)">
    <rect class="box" x="0" y="54" width="150" height="82" rx="16"/><text x="50" y="90" class="t">State</text><text x="36" y="115" class="s">共享状态对象</text>
    <rect class="box" x="230" y="0" width="160" height="78" rx="16"/><text x="275" y="35" class="t">Node A</text><text x="261" y="59" class="s">检索 / 改写</text>
    <rect class="box" x="230" y="130" width="160" height="78" rx="16"/><text x="275" y="165" class="t">Node B</text><text x="270" y="189" class="s">生成 / 评估</text>
    <rect class="box" x="470" y="65" width="170" height="88" rx="16"/><text x="508" y="103" class="t">Reducer</text><text x="500" y="128" class="s">合并状态更新</text>
    <rect class="box" x="720" y="0" width="170" height="78" rx="16"/><text x="765" y="35" class="t">Checkpoint</text><text x="755" y="59" class="s">断点续传</text>
    <rect class="box" x="720" y="130" width="170" height="78" rx="16"/><text x="760" y="165" class="t">Human Review</text><text x="756" y="189" class="s">人工审核节点</text>
  </g>
  <path d="M228 240c72-70 111-70 160-58M228 240c72 68 111 72 160 58M468 184l80 60M468 314l80-60M640 254h80M805 223V78M805 275v0" fill="none" stroke="#312e81" stroke-width="3" stroke-linecap="round"/>
</svg>
