<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Runnable 链式编排</title>
  <desc id="desc">RunnableSequence 串联步骤，RunnableParallel 并行生成上下文。</desc>
  <defs><style>.h{font:700 28px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#222}.p{font:400 15px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#666}.box{fill:#fff;stroke:#ded8cf;stroke-width:2}.name{font:700 17px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#b45309}.small{font:400 13px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#675f55}</style></defs>
  <rect width="980" height="420" rx="28" fill="#fffaf2"/>
  <text x="58" y="66" class="h">Chains：把一次调用升级为工程流水线</text>
  <text x="58" y="96" class="p">面试要点：LCEL 让 Prompt、Model、Parser、Retriever 像积木一样组合，便于替换和调试。</text>
  <g transform="translate(80 148)">
    <rect class="box" width="170" height="86" rx="16"/><text x="40" y="38" class="name">输入清洗</text><text x="31" y="63" class="small">问题改写 / 参数校验</text>
    <rect class="box" x="250" y="-50" width="180" height="86" rx="16"/><text x="285" y="-12" class="name">并行检索</text><text x="282" y="14" class="small">知识库 / Web / 历史</text>
    <rect class="box" x="250" y="72" width="180" height="86" rx="16"/><text x="285" y="110" class="name">并行摘要</text><text x="286" y="136" class="small">压缩上下文</text>
    <rect class="box" x="510" width="170" height="86" rx="16"/><text x="548" y="38" class="name">Prompt</text><text x="537" y="63" class="small">组装上下文</text>
    <rect class="box" x="750" width="170" height="86" rx="16"/><text x="793" y="38" class="name">输出解析</text><text x="790" y="63" class="small">结构化结果</text>
  </g>
  <path d="M250 191h65M510 141l80 50M510 263l80-50M760 191h70" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
</svg>
