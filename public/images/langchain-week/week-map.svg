<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">LangChain 与 LangGraph 一周学习路线</title>
  <desc id="desc">从框架认知、模型调用、链式编排、RAG、Milvus、Agent 到 LangGraph 状态图的一周学习路线。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbf8"/>
      <stop offset="1" stop-color="#eef5ef"/>
    </linearGradient>
    <style>
      .title{font:700 30px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#1f2a24}
      .sub{font:400 15px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#617066}
      .day{font:700 15px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#0f766e}
      .text{font:600 16px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#26312b}
      .small{font:400 13px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#657268}
    </style>
  </defs>
  <rect width="980" height="420" rx="28" fill="url(#bg)"/>
  <path d="M70 278 C190 170 300 330 420 220 S660 145 820 250 S920 210 936 185" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
  <text x="60" y="68" class="title">LangChain / LangGraph 一周学习路线</text>
  <text x="60" y="96" class="sub">把文档知识拆成可复盘、可面试、可转化项目经历的 7 天学习记录</text>
  <g transform="translate(60 150)">
    <g><circle cx="0" cy="128" r="19" fill="#0f766e"/><text x="-7" y="133" fill="#fff" font-size="15" font-weight="700">1</text><text x="-20" y="88" class="day">07/20</text><text x="-20" y="112" class="text">框架认知</text><text x="-20" y="154" class="small">LangChain vs LangGraph</text></g>
    <g transform="translate(140 -44)"><circle cx="0" cy="128" r="19" fill="#134e4a"/><text x="-7" y="133" fill="#fff" font-size="15" font-weight="700">2</text><text x="-28" y="88" class="day">07/21</text><text x="-38" y="112" class="text">Model I/O</text><text x="-45" y="154" class="small">模型调用与结构化输出</text></g>
    <g transform="translate(280 34)"><circle cx="0" cy="128" r="19" fill="#b45309"/><text x="-7" y="133" fill="#fff" font-size="15" font-weight="700">3</text><text x="-28" y="88" class="day">07/22</text><text x="-35" y="112" class="text">Chains</text><text x="-48" y="154" class="small">Runnable 编排</text></g>
    <g transform="translate(420 -20)"><circle cx="0" cy="128" r="19" fill="#0f766e"/><text x="-7" y="133" fill="#fff" font-size="15" font-weight="700">4</text><text x="-28" y="88" class="day">07/23</text><text x="-28" y="112" class="text">RAG</text><text x="-46" y="154" class="small">加载、切分与检索</text></g>
    <g transform="translate(560 -50)"><circle cx="0" cy="128" r="19" fill="#1d4ed8"/><text x="-7" y="133" fill="#fff" font-size="15" font-weight="700">5</text><text x="-28" y="88" class="day">07/24</text><text x="-35" y="112" class="text">Milvus</text><text x="-50" y="154" class="small">向量库与召回</text></g>
    <g transform="translate(700 22)"><circle cx="0" cy="128" r="19" fill="#7c2d12"/><text x="-7" y="133" fill="#fff" font-size="15" font-weight="700">6</text><text x="-28" y="88" class="day">07/25</text><text x="-32" y="112" class="text">Agent</text><text x="-48" y="154" class="small">工具调用与 MCP</text></g>
    <g transform="translate(840 -12)"><circle cx="0" cy="128" r="19" fill="#312e81"/><text x="-7" y="133" fill="#fff" font-size="15" font-weight="700">7</text><text x="-28" y="88" class="day">07/26</text><text x="-44" y="112" class="text">LangGraph</text><text x="-50" y="154" class="small">状态、节点与边</text></g>
  </g>
</svg>
