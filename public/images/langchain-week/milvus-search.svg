<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Milvus 向量检索系统</title>
  <desc id="desc">Milvus 中 Collection、Schema、Index、Insert、Search 与生成回答之间的关系。</desc>
  <defs><style>.h{font:700 28px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#182338}.p{font:400 15px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#5d6675}.box{fill:#fff;stroke:#d8deea;stroke-width:2}.t{font:700 17px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#1d4ed8}.s{font:400 13px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#5e6878}</style></defs>
  <rect width="980" height="420" rx="28" fill="#f6f8fd"/>
  <text x="58" y="66" class="h">Milvus：RAG 的向量检索底座</text>
  <text x="58" y="96" class="p">面试表达要讲清楚：数据模型、索引策略、召回方式、过滤条件和生成链路。</text>
  <g transform="translate(80 140)">
    <rect class="box" width="210" height="180" rx="18"/>
    <text x="38" y="42" class="t">Collection</text><text x="38" y="76" class="s">主键 ID</text><text x="38" y="104" class="s">文本字段</text><text x="38" y="132" class="s">dense / sparse vector</text><text x="38" y="160" class="s">元数据字段</text>
    <rect class="box" x="350" y="0" width="210" height="80" rx="16"/><text x="403" y="34" class="t">Index</text><text x="388" y="58" class="s">相似度搜索加速</text>
    <rect class="box" x="350" y="120" width="210" height="80" rx="16"/><text x="400" y="154" class="t">Search</text><text x="383" y="178" class="s">向量召回 + 标量过滤</text>
    <rect class="box" x="700" y="55" width="190" height="110" rx="18"/><text x="745" y="98" class="t">Rerank</text><text x="735" y="124" class="s">融合排序 / 去重</text>
    <rect class="box" x="700" y="205" width="190" height="80" rx="18"/><text x="748" y="250" class="t">Answer</text>
  </g>
  <path d="M290 210h115M560 180h140M795 305V285M455 220V200" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
</svg>
