<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">RAG 检索增强生成流程</title>
  <desc id="desc">索引阶段加载、切分、嵌入和入库；问答阶段检索、组装提示词并生成答案。</desc>
  <defs><style>.h{font:700 28px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#1c2926}.p{font:400 15px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#63726d}.box{fill:#fff;stroke:#d4dedb;stroke-width:2}.t{font:700 16px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#0f766e}.s{font:400 12px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#5d6b67}</style></defs>
  <rect width="980" height="420" rx="28" fill="#f6fbfa"/>
  <text x="58" y="66" class="h">RAG：把外部知识接入大模型回答</text>
  <text x="58" y="96" class="p">核心价值：缓解知识滞后、知识缺失和幻觉，让答案能引用可追溯资料。</text>
  <g transform="translate(62 142)">
    <rect class="box" width="118" height="78" rx="14"/><text x="29" y="35" class="t">加载文档</text><text x="23" y="58" class="s">PDF / DOCX / MD</text>
    <rect class="box" x="144" width="118" height="78" rx="14"/><text x="173" y="35" class="t">文本切分</text><text x="165" y="58" class="s">chunk / overlap</text>
    <rect class="box" x="288" width="118" height="78" rx="14"/><text x="318" y="35" class="t">向量化</text><text x="319" y="58" class="s">Embedding</text>
    <rect class="box" x="432" width="118" height="78" rx="14"/><text x="468" y="35" class="t">入库</text><text x="468" y="58" class="s">Milvus</text>
    <rect class="box" x="576" width="118" height="78" rx="14"/><text x="611" y="35" class="t">召回</text><text x="602" y="58" class="s">TopK / Filter</text>
    <rect class="box" x="720" width="118" height="78" rx="14"/><text x="750" y="35" class="t">生成</text><text x="743" y="58" class="s">Prompt + LLM</text>
  </g>
  <path d="M180 181h26M324 181h26M468 181h26M612 181h26M756 181h26" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(160 285)">
    <rect width="660" height="70" rx="18" fill="#e8f3f1" stroke="#bfd4d0"/>
    <text x="35" y="43" class="t">索引阶段关注数据质量；问答阶段关注召回质量、上下文压缩、答案引用和评测闭环。</text>
  </g>
</svg>
