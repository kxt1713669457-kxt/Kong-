<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">LangChain 核心模块架构</title>
  <desc id="desc">LangChain 将 Model I/O、Chains、Retrieval 和 Agents 组织成大模型应用开发框架。</desc>
  <defs>
    <style>
      .h{font:700 28px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#1f2a24}
      .p{font:400 15px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#667367}
      .box{fill:#ffffff;stroke:#d8ded7;stroke-width:2}
      .name{font:700 18px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#0f766e}
      .desc{font:400 13px Inter,Arial,"Microsoft YaHei",sans-serif;fill:#59655d}
    </style>
  </defs>
  <rect width="980" height="420" rx="28" fill="#f7faf7"/>
  <text x="60" y="66" class="h">LangChain 核心模块</text>
  <text x="60" y="95" class="p">面试表达：它不是只封装 API，而是把提示词、模型、解析、检索和工具调用变成可组合工程单元。</text>
  <g transform="translate(72 145)">
    <rect class="box" width="178" height="132" rx="18"/>
    <text x="24" y="42" class="name">Model I/O</text>
    <text x="24" y="72" class="desc">Prompt</text><text x="24" y="96" class="desc">ChatModel</text><text x="24" y="120" class="desc">OutputParser</text>
  </g>
  <g transform="translate(292 145)">
    <rect class="box" width="178" height="132" rx="18"/>
    <text x="24" y="42" class="name">Chains</text>
    <text x="24" y="72" class="desc">RunnableSequence</text><text x="24" y="96" class="desc">RunnableParallel</text><text x="24" y="120" class="desc">LCEL 编排</text>
  </g>
  <g transform="translate(512 145)">
    <rect class="box" width="178" height="132" rx="18"/>
    <text x="24" y="42" class="name">Retrieval / RAG</text>
    <text x="24" y="72" class="desc">Loader</text><text x="24" y="96" class="desc">Splitter</text><text x="24" y="120" class="desc">Embedding / VectorStore</text>
  </g>
  <g transform="translate(732 145)">
    <rect class="box" width="178" height="132" rx="18"/>
    <text x="24" y="42" class="name">Agents</text>
    <text x="24" y="72" class="desc">Tool Calling</text><text x="24" y="96" class="desc">MCP</text><text x="24" y="120" class="desc">规划与执行反馈</text>
  </g>
  <path d="M250 211H292M470 211H512M690 211H732" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
</svg>
